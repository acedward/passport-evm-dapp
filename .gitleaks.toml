# gitleaks configuration: the default rules plus this repository's own patterns.
# Run through scripts/secret-scan.sh (before every push) and in CI.

title = "passport-evm-dapp"

[extend]
useDefault = true

# ── Custom rules ─────────────────────────────────────────────────────────────

[[rules]]
id = "env-style-wallet-secret"
description = "A wallet secret assigned in an env-style file (WALLET=, SK=, SEED=, MNEMONIC=, PRIVATE_KEY=, SPONSOR_SEED=)"
regex = '''(?im)^\s*(?:export\s+)?(?:WALLET|SK|SEED|MNEMONIC|PRIVATE_KEY|SPONSOR_SEED|DEPLOYER_KEY)\s*=\s*["']?((?:[a-z]{3,8}[ \t]+){11,23}[a-z]{3,8}|[^\s"'#]{16,})'''
keywords = ["wallet=", "sk=", "seed=", "mnemonic=", "private_key=", "sponsor_seed=", "deployer_key="]

[[rules]]
id = "bip39-mnemonic-labelled"
description = "Twelve to twenty-four lowercase words after a seed, mnemonic or recovery-phrase label"
regex = '''(?i)(?:mnemonic|seed ?phrase|recovery ?phrase|secret ?phrase)["'\s:=]+((?:[a-z]{3,8}[ \t]+){11,23}[a-z]{3,8})\b'''
keywords = ["mnemonic", "seed phrase", "seedphrase", "recovery phrase", "secret phrase"]

[[rules]]
id = "keyed-rpc-url"
description = "An RPC URL that carries a provider API key"
regex = '''https://[a-z0-9.-]*(?:infura\.io|alchemy\.com|alchemyapi\.io|quiknode\.pro|ankr\.com|drpc\.org|blastapi\.io|chainstack\.com|getblock\.io|nodereal\.io|tenderly\.co)/[A-Za-z0-9/_-]{16,}'''
keywords = ["infura", "alchemy", "quiknode", "ankr", "drpc", "blastapi", "chainstack", "getblock", "nodereal", "tenderly"]

[[rules]]
id = "labelled-hex-private-key"
description = "A 32-byte hex value labelled as a private, secret or signing key"
regex = '''(?i)(?:private[_-]?key|secret[_-]?key|signing[_-]?key|seed[_-]?hex)["']?\s*[:=]\s*["']?(?:0x)?([0-9a-f]{64})\b'''
keywords = ["private", "secret", "signing", "seed"]

# ── Allowlists ───────────────────────────────────────────────────────────────

[[allowlists]]
description = "Not this repository's content: the Passport submodule (upstream's own tree), installs and caches"
paths = [
  '''(^|/)vendor/passport/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.tools/''',
  '''(^|/)bun\.lock$''',
]

# The vendored PR #4 deployment records (PROVENANCE.md): the values the default generic-api-key
# rule flags there are PUBLIC keys (the MPC's and the deployer's). Scoped to that rule, those
# files AND those field names only. (A top-level [[allowlists]] with targetRules does not reach a
# default rule in gitleaks 8.28; extending the rule's own allowlist does.)
[[rules]]
id = "generic-api-key"
[[rules.allowlists]]
condition = "AND"
paths = ['''(^|/)packages/core/src/tokens/deployments/[a-z0-9-]+\.json$''']
regexTarget = "match"
regexes = ['''^(?:mpcResponseKey|mpcRootPublicKey|deployerPublicKey)"''']
