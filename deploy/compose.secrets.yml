# Mount the two secrets as files. The host paths are never committed; the files stay mode 600.
services:
  relay:
    environment:
      SPONSOR_SEED_FILE: /run/secrets/sponsor_seed
      SEPOLIA_RPC_URL_FILE: /run/secrets/sepolia_rpc_url
    secrets:
      - sponsor_seed
      - sepolia_rpc_url
secrets:
  sponsor_seed:
    file: ${SPONSOR_SEED_HOST_FILE:?set SPONSOR_SEED_HOST_FILE}
  sepolia_rpc_url:
    file: ${SEPOLIA_RPC_URL_HOST_FILE:?set SEPOLIA_RPC_URL_HOST_FILE}
