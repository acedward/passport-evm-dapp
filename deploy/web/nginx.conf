# MN Bank web: the static site plus a same-origin proxy to the relay (/relay/ -> relay:8080/).
# Runs unprivileged on a read-only root file system: everything it writes is under /tmp (tmpfs).
# /tmp/mnbank/*.conf and config.json are written at start by /usr/local/bin/mnbank-web.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65s;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # No query strings in the access log (they can carry an account address; never a secret).
  log_format mnbank '$remote_addr [$time_iso8601] "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout mnbank;

  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
  gzip_min_length 1024;

  # resolver, $relay_upstream, and the trusted proxies (real client address).
  include /tmp/mnbank/http.conf;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Optional Content-Security-Policy (WEB_CONTENT_SECURITY_POLICY).
    include /tmp/mnbank/headers.conf;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # The site's runtime configuration (network, relay URL), written at start.
    location = /config.json {
      alias /tmp/mnbank/config.json;
      default_type application/json;
      expires -1;
    }

    # The relay, on the same origin: the browser never needs CORS. The relay sees exactly one
    # X-Forwarded-For entry, the client address as nginx determined it (RELAY_TRUST_PROXY=true).
    location /relay/ {
      rewrite ^/relay/(.*)$ /$1 break;
      proxy_pass $relay_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
    }

    # Fingerprinted build output.
    location /assets/ {
      expires 30d;
      try_files $uri =404;
    }

    location / {
      expires -1;
      try_files $uri $uri/ /index.html;
    }
  }
}
